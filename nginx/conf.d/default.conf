limit_req_zone $binary_remote_addr zone=api_calculator_rpm:10m rate=3r/m;

upstream api_calculator_upstream {
    zone api_calculator_upstream 64k;
    server api-calculator:8080 resolve;
}

server {
    listen 80;
    server_name _;

    location = /rate-limit-exceeded.json {
        internal;
        default_type application/json;
        return 429 '{"status":429,"code":"TOO_MANY_REQUESTS","message":"Rate limit exceeded. Maximum 3 requests per minute.","errors":[]}';
    }

    location /actuator/ {
        proxy_pass http://api_calculator_upstream;
        proxy_http_version 1.1;
        add_header X-Upstream-Addr $upstream_addr always;
        add_header X-Upstream-Status $upstream_status always;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/v1/ {
        limit_req zone=api_calculator_rpm burst=2 nodelay;
        limit_req_status 429;
        error_page 429 = /rate-limit-exceeded.json;

        proxy_pass http://api_calculator_upstream;
        proxy_http_version 1.1;
        add_header X-Upstream-Addr $upstream_addr always;
        add_header X-Upstream-Status $upstream_status always;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
