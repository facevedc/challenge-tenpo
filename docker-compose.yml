services:
  postgres:
    container_name: challenge-tenpo-postgres
    image: postgres:17.9-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenpo_challenge
      POSTGRES_USER: tenpo
      POSTGRES_PASSWORD: tenpo_secret
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenpo -d tenpo_challenge"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - challenge-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  api-mocks:
    container_name: challenge-tenpo-api-mocks
    image: wiremock/wiremock:3.9.1
    restart: unless-stopped
    command: ["--port", "8080", "--global-response-templating"]
    ports:
      - "8081:8080"
    volumes:
      - ./api-mocks/wiremock:/home/wiremock
    networks:
      - challenge-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  redis:
    container_name: challenge-tenpo-redis
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - challenge-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  api-calculator:
    build:
      context: ./api-calculator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-mocks:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tenpo_challenge
      DB_USERNAME: tenpo
      DB_PASSWORD: tenpo_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PERCENTAGE_BASE_URL: http://api-mocks:8080
    networks:
      challenge-net:
        aliases:
          - api-calculator
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 768M

  nginx:
    container_name: challenge-tenpo-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api-calculator
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - challenge-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

volumes:
  postgres_data:
  redis_data:

networks:
  challenge-net:
    driver: bridge
