name: Pull Request

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-calculator-check:
    name: API Calculator Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-calculator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Run tests and coverage verification
        run: ./gradlew test jacocoTestCoverageVerification

      - name: Add coverage to PR
        id: jacoco
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: |
            ${{ github.workspace }}/**/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 100
          min-coverage-changed-files: 100
          title: Code Coverage
          update-comment: true

      - name: Fail PR if overall coverage is less than 100%
        if: ${{ steps.jacoco.outputs.coverage-overall < 100.0 }}
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Overall coverage is less than 100%!')
