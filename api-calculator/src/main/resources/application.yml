spring:
  application:
    name: api-calculator
  main:
    web-application-type: reactive
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: ${spring.application.name}
    description: API reactiva para challenge Tenpo
    version: 1.0.0-bootstrap

tenpo:
  client:
    percentage:
      base-url: ${PERCENTAGE_BASE_URL:http://localhost:8081}
      path: /external/percentage
  cache:
    percentage-ttl-minutes: 30
  rate-limit:
    requests-per-minute: 3

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    tenpo: INFO

rest-client:
  config:
    idle-timeout: 3000
    connection-timeout: 2000
